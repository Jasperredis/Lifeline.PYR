0:
    title: How to Use this Tab
    version: 1.0
    date: x
    install: https://lifelinepyr.jasperredis.net
    desc: |
      This is the Others tab.
      Here, you can see previous
      updates.
      ---
      Press [Q] or to see the next
      oldest.
      Press [E] or to see the next
      newest.
      Press [X] to leave this tab and
      return to the most recent update.
      Remember: Q, E, X.
      ---
      Press [SPACE] to get on to the
      first page.
      Warning: If there is only one
      update availible, [SPACE] will
      do nothing.
1:
    title: Release
    version: 1.0.1
    date: 2026-06-04
    install: https://lifelinepyr.jasperredis.net
    desc: |
      Welcome to Lifeline.PYR! :3
      (This is scrollable.)
      
      This is the second version of the
      game.
      The first time, I messed up the
      URL to the updates file.
      
      I hope you like it.
      
      Leave feedback by contacting me
      on jasperredisispublic@gmail.com
      or GitHub Issues/Discussions if
      you have anything to say about
      the game.
      
      Have fun! :3c
2:
    title: Update progress
    version: 1.0.1
    date: 2026-07-28
    install: https://lifelinepyr.jasperredis.net
    desc: |
      The v1.1 update for Lifeline.PYR
      has begun in progress! It
      actually did that a bit before
      this update, though I never
      wrote anything about it.
      (This is scrollable.)
      
      For updates on how that is
      going, see the GitHub
      repository (press the X, go to
      ABOUT, scroll down and click GO
      next to the text saying GitHub),
      and find the dev branch, then
      see the "DEVELOPMENT.org" file.

      If you, however, do not want to
      do that, I may occasionally log
      changes here.

      As of the most recent update,
      there is now:
      - Colour palettes (the new one,
        "Canonical", is pretty)
      - A slightly different life tick
        sprite
      - More tips
      - Minor technical changes (good
        ones)
      - Possibly more? I'm honestly
        not 100% sure, I'd have to
        check.
      
      That's all for now!
      Bye bye :3
3:
    title: v1.1 Updates, New HTP
    version: 1.0.1
    date: 2026-07-30
    install: https://lifelinepyr.jasperredis.net
    desc: |
      Hello!
      I've just written a brand new How
      to Play screen, but it's not in
      the game; it's on the website.
      To get to said website, you can
      use the INSTALL button.
      Then, you click "How to Play" in
      the header.
      (This is scrollable.)
      
      This how to play screen is nice,
      because it explains things better
      and actually has a laser image.

      Why did I write this? I'm getting
      rid of the HOW TO PLAY screen
      in Lifeline.PYR v1.1, because
      it's unnecessarily complicated,
      updates are difficult without
      having to update the entire game,
      and a webpage can actually render
      a more readable font.

      This is also going to be one of
      the last updates. Which sounds
      pretty dramatic considering
      there's only 3 of them. I'm also
      removing the UPDATES menu in
      Lifeline.PYR v1.1, for the same
      reasons as I am the HOW TO PLAY
      screen, except even more so
      because fetching this stupid
      YAML file is incredibly complex
      for what could just be a web
      browser link.

      That's all. Bye bye :3
4:
    title: This is retired!
    version: 1.0.1
    date: 2026-08-10
    install: https://jasperredis.net/updates.html#lifelinepyr
    desc: |
      Hello!
      As you may be able to infer from
      the title of this update, the in-
      game updates screen is now
      retired. (This is scrollable.)
      The new canonical source of
      updates can be found by pressing
      the INSTALL button down below
      (I used it as a hyperlink, haha),
      or you can manually type in:
      >> jasperredis.net/updates.html
      The updates are now held at my
      main website.
      
      Now, this is not all I have to
      say in this update. The code
      repository for this game has been
      migrated from GitHub to Codeberg.
      Yes, that means that the GitHub
      link on the terminal text and
      ABOUT screen is somewhat outdated
      now. The GitHub repository still
      exists, but only as a mirror. If
      you are looking to contribute, do
      so on the Codeberg repository.

      This is the last update that will
      be on the updates screen!!!!

      Bye :3

      
